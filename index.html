<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restfood Restaurant</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000;
    color: #fff;
}

header {
    display: flex;
    justify-content: space-between;
    padding: 20px 50px;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #ffd700;
}

nav a {
    margin: 0 15px;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 50px;
}

.left {
    max-width: 500px;
}

.left h1 {
    font-size: 60px;
    margin-bottom: 20px;
}

.left p {
    color: #ccc;
    margin-bottom: 30px;
}

.btn {
    background: #ffd700;
    color: black;
    padding: 12px 25px;
    text-decoration: none;
    font-weight: bold;
}

.right img {
    width: 500px;
    border-radius: 10px;
}

</style>
</head>

<body>

<header>
    <div class="logo">RESTFOOD</div>
    <nav>
        <a href="#">Home</a>
        <a href="#">About Us</a>
        <a href="#">Chefs</a>
        <a href="#">Menu</a>
        <a href="#">Gallery</a>
        <a href="#">Contacts</a>
    </nav>
</header>

<section class="hero">
    <div class="left">
        <h1>BEST QUALITY FOOD</h1>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Molestias provident laborum.</p>
        <a href="#" class="btn">BOOK A TABLE</a>
    </div>

    <div class="right">
        <img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092" alt="food">
    </div>
</section>

</body>
</html>
