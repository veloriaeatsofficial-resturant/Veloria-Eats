<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Union Bank - Tracking</title>

<link rel="stylesheet" href="tracking.css">
</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">
🏦 GLOBAL UNION BANK
</div>

<!-- SEARCH BOX -->
<div class="card">

<h2>Transfer Tracking</h2>

<input type="text" id="txid" placeholder="Enter Transaction ID">

<button onclick="trackTransaction()">
Track Transfer
</button>

</div>

<!-- RESULT -->
<div id="result" class="card" style="display:none;">

<h3>Transaction Details</h3>

<div id="details"></div>

</div>

<!-- PROGRESS -->
<div id="progressCard" class="card" style="display:none;">

<h3>Transfer Progress</h3>

<div id="progress"></div>

</div>

<!-- BANK MESSAGE -->
<div id="messageCard" class="card" style="display:none;">

<h3>Bank Message</h3>

<p id="bankMessage"></p>

</div>

<!-- LOADING -->
<div id="loading" style="display:none;" class="card">

<p>Checking transaction...</p>

</div>

</div>

<script src="tracking.js"></script>

</body>
</html>
